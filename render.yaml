services:
  - type: web
    name: axomrank
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: ALLOW_REMOTE_HOST
        value: "1"
      - key: CONTROL_CENTER_DATA_DIR
        value: "/tmp/control-center-data"
