services:
  - type: web
    name: axomrank-web
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  - type: cron
    name: axomrank-nightly-sync
    env: node
    plan: free
    region: singapore
    schedule: "0 1 * * *"
    buildCommand: npm install
    startCommand: "node scripts/nightly-sync.mjs"
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
